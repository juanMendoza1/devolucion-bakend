# ===============================
# 0. SECRETOS
# ===============================
# Los valores sensibles NO van en este archivo. Se leen de variables de entorno
# o del archivo .env en la raíz del proyecto (ignorado por git; ver .env.example).
spring.config.import=optional:file:.env[.properties]

# ===============================
# 1. CONEXION A POSTGRESQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devoluciones_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 2. CONFIGURACION DE JPA / HIBERNATE
# ===============================
# 'update' actualiza el esquema de la BD automaticamente segun tus clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 3. OPTIMIZACION PARA IMPORTACIONES MASIVAS (BATCHING)
# ===============================
# Agrupa las sentencias SQL en lotes de 50 para no colapsar la red
spring.jpa.properties.hibernate.jdbc.batch_size=2000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# 4. LIMITES DE SUBIDA DE ARCHIVOS
# ===============================
# Aumentamos el limite a 50MB para soportar la carga de archivos CSV pesados
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# 5. CONFIGURACION DE SEGURIDAD (JWT)
# ===============================
# Clave HS256 en Base64 (mínimo 32 bytes). Generar con: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# 6. CORS (origenes del frontend, separados por coma)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
